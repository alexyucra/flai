[project]
name = "flai-ia"
version = "0.1.11"
description = "Flai - Framework local para ia"
readme = "./README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

authors = [
    { name = "Alex Yucra" }
]

keywords = [
    "ia local",
    "localhost ia",
    "framework de ia local",
    "pip install flai",
    "flai",
    "flet",
    "ollama",
    "llm local",
    "framework",
    "mvc",
    "ui",
    "desktop",
    "mobile",
    "apk",
    "app",
    "android"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "fleting",
    "flet",
    "rich",
    "typer",
    "click",
    "psutil",
    "pyyaml>=6",
    "requests>=2.31",
    "pydantic>=2,<3",
    "unidecode",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
# RAG: índice local leve (JSON) + embeddings do Ollama. Sem estes pacotes o FLAI
# usa a API HTTP do Ollama e um divisor de texto interno. Sem chromadb.
rag = ["langchain-ollama>=0.2", "langchain-text-splitters>=0.3"]
# Documentação: mkdocs serve / mkdocs build --strict
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
# Provedor externo (flai.yml) — reservado, não usado até o FLAI estar finalizado
remote = ["langchain-groq", "python-dotenv"]
dev = ["pytest", "pytest-cov"]

# ------------------------
# CLI ENTRY POINT
# ------------------------
[project.scripts]
flai = "flai.cli.cli:main"

# ------------------------
# URLs (PyPI)
# ------------------------
[project.urls]
Homepage = "https://github.com/alexyucra/flai"
Documentation = "https://alexyucra.github.io/flai/"
Repository = "https://github.com/alexyucra/flai"
Issues = "https://github.com/alexyucra/flai/issues"

# ------------------------
# BUILD SYSTEM (Poetry)
# ------------------------
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "flai" }]
